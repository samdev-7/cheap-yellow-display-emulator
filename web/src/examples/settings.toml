# settings.toml: settings CircuitPython reads when it starts, and values
# your code can read with os.getenv("NAME").

# Turn the screen: 0 is landscape with the USB port on the right as you look
# at the screen. 90, 180 and 270 rotate it.
CIRCUITPY_DISPLAY_ROTATION = 0

# Your own settings, for code.py to read:
#     import os
#     greeting = os.getenv("GREETING")
GREETING = "Hello, CYD!"

# Wi-Fi: remove the # from both lines to join this network when the board
# starts. A real board waits about 20 seconds for a network it can't find
# before it runs code.py. The emulator joins any network name; what it finds
# can be changed in the board's ⋯ menu.
# CIRCUITPY_WIFI_SSID = "your_network"
# CIRCUITPY_WIFI_PASSWORD = "your_password"
