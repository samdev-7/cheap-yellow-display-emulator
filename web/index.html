<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CYD CircuitPython Emulator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='5' width='28' height='22' rx='3' fill='%23f5c518'/%3E%3Crect x='6' y='9' width='20' height='14' rx='1' fill='%23111'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <span class="brand-chip" aria-hidden="true"></span>
        <span>CYD CircuitPython</span>
        <span class="version" id="version">10.3.1</span>
      </div>
      <div class="actions">
        <div class="project-switch">
          <input id="project-name" class="project-name" aria-label="Project name (click to rename)" title="Click to rename this project" spellcheck="false" autocomplete="off" />
          <button id="project-menu" class="project-menu" aria-haspopup="menu" aria-label="Projects and examples" title="Projects and examples">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button id="download" title="Save every file as a zip, ready to copy onto the board">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5V10M4.5 6.5 8 10l3.5-3.5M2.5 11v2.5h11V11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Export zip</span>
        </button>
      </div>
      <div class="status" id="status" role="status">Starting…</div>
      <button id="settings" class="settings" aria-haspopup="menu" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.9 1.5h2.2l.4 1.9 1.3.6 1.7-1 1.5 1.6-1 1.6.6 1.4 1.9.4v2.2l-1.9.4-.6 1.4 1 1.6-1.5 1.6-1.7-1-1.3.6-.4 1.9H6.9l-.4-1.9-1.3-.6-1.7 1-1.5-1.6 1-1.6-.6-1.4-1.9-.4V6.9l1.9-.4.6-1.4-1-1.6 1.5-1.6 1.7 1 1.3-.6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </header>

    <main class="workspace" id="workspace" data-keep-x="320">
      <aside class="files" aria-label="Files">
        <div class="pane-title">
          <span>Files</span>
          <span class="pane-actions">
            <button id="new-file" class="icon" title="New file" aria-label="New file">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h6.5L13 5v9.5H3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 7.5v5M5.5 10h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
            <button id="new-folder" class="icon" title="New folder" aria-label="New folder">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h4.2l1.4 1.6h7.4v7.9h-13z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 7v4.5M5.75 9.25h4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            </button>
            <button id="upload" class="icon" title="Add files from your computer" aria-label="Upload files">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 11v2.5h11V11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <input id="upload-input" type="file" multiple hidden />
          </span>
        </div>
        <ul id="file-tree"></ul>
      </aside>
      <div class="splitter" data-var="--files-w" data-axis="x" data-min="160" data-max="420" data-max-share="0.3" data-default="220" aria-label="Resize the file browser"></div>

      <section class="editor-pane">
        <div class="pane-title">
          <span id="editor-title">code.py</span>
        </div>
        <div id="editor" class="editor"></div>
      </section>

      <div class="splitter splitter-device" data-var="--device-w" data-axis="x" data-invert="true" data-min="300" data-max="1100" data-max-share="0.55" data-default="560" aria-label="Resize the board view"></div>

      <div class="side-column">
        <section class="device-pane" aria-label="Emulated board">
          <div id="board"></div>
          <div class="device-controls" role="toolbar" aria-label="Board controls">
            <button id="run" class="primary" title="Put your files on the board and start it, like flashing it (Ctrl+S)">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11.5V2.5M4.5 6 8 2.5 11.5 6M2.5 11v2.5h11V11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Upload and Run</span>
            </button>
            <button id="reset" title="Press the board's reset button: restart with what's on it">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3.2 1.8v3.1h3.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Reset</span>
            </button>
            <button id="flip" aria-pressed="false" title="Show the back of the board">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 0 1 9.6-3.7M13.5 8a5.5 5.5 0 0 1-9.6 3.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12.6 1.8v2.9H9.7M3.4 14.2v-2.9h2.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Flip</span>
            </button>
            <button id="power" class="power" aria-pressed="true" title="Turn the board's power off or on">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8v5.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4.6 4.2a5.2 5.2 0 1 0 6.8 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span id="power-label">On</span>
            </button>
            <button id="board-more" class="square" aria-haspopup="menu" aria-label="More board settings" title="More board settings">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="12.5" cy="8" r="1.4" fill="currentColor"/></svg>
            </button>
          </div>
        </section>
        <section class="console-pane" id="console-pane">
          <div class="pane-title">
            <span>Serial console</span>
            <span class="pane-actions">
                <button id="clear-console" class="link">Clear</button>
                <button id="toggle-console" class="link" aria-expanded="true" aria-controls="console">Hide</button>
            </span>
          </div>
          <div id="console" class="console"></div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
